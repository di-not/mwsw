<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Корзина - MWSW</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
        .cart-container {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 30px;
            margin-top: 30px;
        }

        .cart-items {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .cart-summary {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            height: fit-content;
        }

        .cart-item {
            display: flex;
            align-items: center;
            padding: 20px 0;
            border-bottom: 1px solid #eee;
        }

        .cart-item:last-child {
            border-bottom: none;
        }

        .item-image {
            width: 100px;
            height: 100px;
            object-fit: cover;
            border-radius: 10px;
            margin-right: 20px;
        }

        .item-details {
            flex-grow: 1;
        }

        .item-name {
            font-weight: bold;
            margin-bottom: 5px;
            font-size: 1.1em;
        }

        .item-price {
            color: #2c3e50;
            font-weight: bold;
        }

        .quantity-controls {
            display: flex;
            align-items: center;
            margin: 10px 0;
        }

        .quantity-btn {
            background: #f5f5f5;
            border: none;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            transition: background 0.3s;
        }

        .quantity-btn:hover {
            background: #e0e0e0;
        }

        .quantity {
            margin: 0 15px;
            font-weight: bold;
            min-width: 30px;
            text-align: center;
        }

        .remove-btn {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .remove-btn:hover {
            background: #c0392b;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid #eee;
        }

        .summary-total {
            font-weight: bold;
            font-size: 1.2em;
            color: #2c3e50;
        }

        .empty-cart {
            text-align: center;
            padding: 50px 20px;
        }

        .empty-cart-icon {
            font-size: 4em;
            color: #bdc3c7;
            margin-bottom: 20px;
        }

        .toast-notification {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 12px 20px;
            border-radius: 8px;
            z-index: 1000;
            animation: slideIn 0.3s ease;
            color: white;
        }

        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .sold-out-item {
            opacity: 0.6;
        }

        .sold-out-item .quantity-controls {
            opacity: 0.5;
            pointer-events: none;
        }

        .sold-out-badge {
            background: #e74c3c;
            color: white;
            padding: 3px 8px;
            border-radius: 5px;
            font-size: 0.8em;
            margin-left: 10px;
        }

        @media (max-width: 768px) {
            .cart-container {
                grid-template-columns: 1fr;
            }

            .cart-item {
                flex-direction: column;
                text-align: center;
            }

            .item-image {
                margin-right: 0;
                margin-bottom: 15px;
            }

            .remove-btn {
                margin-top: 10px;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <div class="logo">
                <a href="index.html">MWSW</a>
                <p>The Man Who Sold The World</p>
            </div>
            <nav>
                <ul>
                    <li><a href="index.html">Главная</a></li>
                    <li><a href="catalog.html">Каталог</a></li>
                    <li><a href="favorites.html">Избранное</a></li>
                    <li><a href="cart.html" class="active">Корзина</a></li>
                    <li><a href="login.html" id="auth-link">Войти</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <div class="container">
            <h1>Корзина</h1>
            <div id="cart-container" class="cart-container"></div>
        </div>
    </main>

    <footer>
        <div class="container">
            <div class="footer-links">
                <a href="index.html">О нас</a>
                <a href="#">Facebook</a>
                <a href="#">Twitter</a>
                <a href="#">Instagram</a>
            </div>
            <p>&copy; 2024 MWSW - The Man Who Sold The World. Все права защищены.</p>
        </div>
    </footer>

    <script>
        const API_BASE_URL = 'http://localhost:5280';
        let currentUser = null;
        let allPlanets = [];

        function checkAuth() {
            const user = localStorage.getItem('currentUser') || sessionStorage.getItem('currentUser');
            if (user) {
                currentUser = JSON.parse(user);
                const displayName = currentUser.fullName || currentUser.FullName || 'Профиль';
                document.getElementById('auth-link').textContent = displayName ? displayName.split(' ')[0] : 'Профиль';
                document.getElementById('auth-link').href = 'profile.html';
            } else {
                document.getElementById('auth-link').textContent = 'Войти';
                document.getElementById('auth-link').href = 'login.html';
            }
            loadAllPlanets();
        }

        async function loadAllPlanets() {
            try {
                const response = await fetch(`${API_BASE_URL}/api/planets`);
                const planets = await response.json();
                allPlanets = Array.isArray(planets)
                    ? planets.map(normalizePlanet).filter(Boolean)
                    : [];
                loadCart();
            } catch (error) {
                console.error('Ошибка загрузки планет:', error);
                loadCart();
            }
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function formatPrice(price) {
            if (!price && price !== 0) return '0';
            return price.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
        }

        function normalizePlanet(planet) {
            if (!planet || typeof planet !== 'object') return null;

            const id = Number(planet.id ?? planet.Id ?? 0);
            const priceRaw = Number(planet.price ?? planet.Price ?? 0);

            return {
                id: Number.isFinite(id) ? id : 0,
                name: planet.name ?? planet.Name ?? 'Планета',
                imageUrl: planet.imageUrl ?? planet.ImageUrl ?? null,
                price: Number.isFinite(priceRaw) ? priceRaw : 0,
                soldOut: Boolean(planet.soldOut ?? planet.SoldOut ?? false)
            };
        }

        function normalizeCartItems(items) {
            if (!Array.isArray(items)) return [];

            return items.map(item => {
                const id = Number(item?.id ?? item?.Id ?? 0);
                const planetIdRaw = Number(item?.planetId ?? item?.PlanetId ?? 0);
                const quantityRaw = Number(item?.quantity ?? item?.Quantity ?? 1);
                const planet = normalizePlanet(item?.planet ?? item?.Planet);

                const planetId = Number.isFinite(planetIdRaw) && planetIdRaw > 0
                    ? planetIdRaw
                    : (planet?.id ?? 0);

                const quantity = Number.isFinite(quantityRaw) && quantityRaw > 0 ? quantityRaw : 1;

                return {
                    id: Number.isFinite(id) ? id : 0,
                    planetId,
                    quantity,
                    planet
                };
            }).filter(item => item.id > 0 && item.planetId > 0);
        }

        function showNotification(message, type) {
            const notification = document.createElement('div');
            notification.className = 'toast-notification';
            notification.style.background = type === 'error' ? '#e74c3c' : '#27ae60';
            notification.textContent = message;
            document.body.appendChild(notification);
            setTimeout(() => notification.remove(), 3000);
        }

        async function loadCart() {
            try {
                const userId = currentUser?.id ?? currentUser?.Id;
                const url = userId !== null && userId !== undefined
                    ? `${API_BASE_URL}/api/cart?userId=${encodeURIComponent(userId)}`
                    : `${API_BASE_URL}/api/cart`;
                const response = await fetch(url);
                const rawItems = await response.json();
                const items = normalizeCartItems(rawItems);
                displayCart(items);
            } catch (error) {
                console.error('Ошибка загрузки корзины:', error);
                document.getElementById('cart-container').innerHTML = '<div class="empty-cart"><p>Ошибка загрузки корзины</p></div>';
            }
        }

        function displayCart(items) {
            const container = document.getElementById('cart-container');
            
            if (!items || items.length === 0) {
                container.innerHTML = `
                    <div class="empty-cart">
                        <div class="empty-cart-icon">🛒</div>
                        <h2>Корзина пуста</h2>
                        <p>Добавьте планеты в корзину, чтобы оформить заказ</p>
                        <a href="catalog.html" class="btn">Перейти в каталог</a>
                    </div>
                `;
                return;
            }

            let subtotal = 0;
            const deliveryCost = 500000000;
            
            const itemsHtml = items.map(item => {
                // Получаем актуальную информацию о планете
                const planet = allPlanets.find(p => p.id === item.planetId) || item.planet;
                const price = Number(planet?.price ?? 0);
                const quantity = Number(item.quantity);
                const itemTotal = price * quantity;
                subtotal += itemTotal;
                const isSoldOut = planet?.soldOut === true;
                
                return `
                    <div class="cart-item ${isSoldOut ? 'sold-out-item' : ''}" data-item-id="${item.id}">
                        <img src="${planet?.imageUrl || 'https://via.placeholder.com/100'}" 
                             alt="${escapeHtml(planet?.name || 'Планета')}" 
                             class="item-image"
                             onerror="this.src='https://via.placeholder.com/100'">
                        <div class="item-details">
                            <div class="item-name">
                                ${escapeHtml(planet?.name || 'Планета')}
                                ${isSoldOut ? '<span class="sold-out-badge">Распродано</span>' : ''}
                            </div>
                            <div class="item-price">${formatPrice(price)} ₽</div>
                            ${!isSoldOut ? `
                                <div class="quantity-controls">
                                    <button class="quantity-btn" onclick="updateQuantity(${item.id}, ${quantity - 1})">-</button>
                                    <span class="quantity">${quantity}</span>
                                    <button class="quantity-btn" onclick="updateQuantity(${item.id}, ${quantity + 1})">+</button>
                                </div>
                            ` : `
                                <div class="quantity-controls">
                                    <span class="quantity">${quantity}</span>
                                </div>
                            `}
                        </div>
                        <button class="remove-btn" onclick="removeFromCart(${item.id})">Удалить</button>
                    </div>
                `;
            }).join('');

            const tax = subtotal * 0.2;
            const total = subtotal + deliveryCost + tax;

            container.innerHTML = `
                <div class="cart-items">
                    <h2>Товары в корзине (${items.length})</h2>
                    ${itemsHtml}
                </div>
                <aside class="cart-summary">
                    <h3>Итог заказа</h3>
                    <div class="summary-row">
                        <span>Товары (${items.reduce((sum, i) => sum + (Number.isFinite(i.quantity) ? i.quantity : 0), 0)})</span>
                        <span>${formatPrice(subtotal)} ₽</span>
                    </div>
                    <div class="summary-row">
                        <span>Доставка</span>
                        <span>${formatPrice(deliveryCost)} ₽</span>
                    </div>
                    <div class="summary-row">
                        <span>Налоги (20%)</span>
                        <span>${formatPrice(tax)} ₽</span>
                    </div>
                    <div class="summary-row summary-total">
                        <span>Итого</span>
                        <span>${formatPrice(total)} ₽</span>
                    </div>
                    <button class="btn" style="width: 100%; margin-top: 20px" onclick="checkout()">Оформить заказ</button>
                    <p style="text-align: center; margin-top: 15px; font-size: 0.9em; color: #7f8c8d">
                        Нажимая "Оформить заказ", вы соглашаетесь с нашими условиями продажи
                    </p>
                </aside>
            `;
        }

        async function updateQuantity(cartItemId, newQuantity) {
            if (newQuantity < 1) {
                await removeFromCart(cartItemId);
                return;
            }
            
            try {
                const response = await fetch(`${API_BASE_URL}/api/cart/${cartItemId}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ quantity: newQuantity })
                });
                
                if (response.ok) {
                    loadCart();
                } else {
                    const error = await response.json();
                    showNotification(error.message || 'Ошибка при обновлении', 'error');
                }
            } catch (error) {
                console.error('Ошибка обновления количества:', error);
                showNotification('Ошибка при обновлении', 'error');
            }
        }

        async function removeFromCart(cartItemId) {
            try {
                const response = await fetch(`${API_BASE_URL}/api/cart/${cartItemId}`, {
                    method: 'DELETE'
                });
                
                if (response.ok) {
                    loadCart();
                    showNotification('Товар удален из корзины', 'success');
                }
            } catch (error) {
                console.error('Ошибка удаления из корзины:', error);
                showNotification('Ошибка при удалении', 'error');
            }
        }

        function checkout() {
            if (!currentUser) {
                showNotification('Пожалуйста, войдите в аккаунт для оформления заказа', 'error');
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 1500);
                return;
            }
            showNotification('Функция оформления заказа будет доступна в следующей версии', 'info');
        }

        document.addEventListener('DOMContentLoaded', checkAuth);
    </script>
</body>
</html>
