<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Каталог планет - MWSW</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
      .catalog-container {
        display: flex;
        gap: 30px;
        margin-top: 30px;
      }

      .filters {
        width: 25%;
        background: #f5f5f5;
        padding: 20px;
        border-radius: 10px;
        height: fit-content;
        position: sticky;
        top: 20px;
      }

      .catalog {
        width: 75%;
      }

      .filter-group {
        margin-bottom: 20px;
      }

      .filter-group h3 {
        margin-bottom: 10px;
        border-bottom: 1px solid #ddd;
        padding-bottom: 5px;
      }

      .filter-option {
        margin-bottom: 8px;
      }

      .planets-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 25px;
      }

      .planet-card {
        background: white;
        border-radius: 12px;
        overflow: hidden;
        min-width: 0;
        transition:
          transform 0.3s,
          box-shadow 0.3s;
        position: relative;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
      }

      /* Отключаем глобальную желтую псевдо-подложку из styles.css */
      .planet-card::before {
        content: none !important;
        display: none !important;
      }

      .planet-card:hover {
        transform: translateY(-10px);
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
      }

      .planet-card.sold-out {
        opacity: 0.7;
      }

      .planet-card.sold-out::after {
        content: "Распродано";
        position: absolute;
        top: 10px;
        left: 10px;
        background: #e74c3c;
        color: white;
        padding: 5px 10px;
        border-radius: 5px;
        font-size: 0.8em;
        z-index: 2;
      }

      .planet-media {
        position: relative;
        overflow: hidden;
      }

      .planet-image {
        width: 100%;
        height: 200px;
        object-fit: cover;
        display: block;
        background: #f3f6fa;
        transition: transform 0.3s;
      }

      .planet-card:hover .planet-image {
        transform: scale(1.05);
      }

      .planet-info {
        padding: 15px;
        min-width: 0;
        overflow: hidden;
      }

      .planet-price {
        font-weight: bold;
        color: #2c3e50;
        font-size: 1.2em;
        margin: 10px 0;
      }

      .planet-description {
        color: #666;
        font-size: 0.9em;
        margin-bottom: 15px;
        min-height: 60px;
        overflow-wrap: anywhere;
        word-break: break-word;
      }

      .planet-info h3,
      .planet-info h3 a {
        overflow-wrap: anywhere;
        word-break: break-word;
      }

      .favorite-btn {
        position: absolute;
        top: 10px;
        right: 10px;
        background: white;
        border: none;
        border-radius: 50%;
        width: 36px;
        height: 36px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.2em;
        transition: all 0.3s;
        z-index: 12;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
      }

      .favorite-btn:hover {
        transform: scale(1.1);
      }

      .favorite-btn.active {
        color: #e74c3c;
      }

      .sorting {
        margin-bottom: 20px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 15px;
      }

      .sorting select,
      .sorting input {
        padding: 8px 12px;
        border: 1px solid #ddd;
        border-radius: 5px;
      }

      .search-box {
        display: flex;
        gap: 10px;
      }

      .search-box input {
        width: 250px;
      }

      @media (max-width: 768px) {
        .catalog-container {
          flex-direction: column;
        }

        .filters,
        .catalog {
          width: 100%;
        }

        .filters {
          position: static;
        }

        .search-box input {
          width: 100%;
        }
      }

      .loading-spinner {
        text-align: center;
        padding: 50px;
      }

      .no-results {
        text-align: center;
        padding: 50px;
        color: #7f8c8d;
      }

      .toast-notification {
        position: fixed;
        bottom: 20px;
        right: 20px;
        padding: 12px 20px;
        border-radius: 8px;
        z-index: 1000;
        animation: slideIn 0.3s ease;
        color: white;
      }

      @keyframes slideIn {
        from {
          transform: translateX(100%);
          opacity: 0;
        }
        to {
          transform: translateX(0);
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="container">
        <div class="logo">
          <a href="index.html">MWSW</a>
          <p>The Man Who Sold The World</p>
        </div>
        <nav>
          <ul>
            <li><a href="index.html">Главная</a></li>
            <li><a href="catalog.html" class="active">Каталог</a></li>
            <li><a href="favorites.html">Избранное</a></li>
            <li><a href="cart.html" id="cart-link">Корзина</a></li>
            <li><a href="add-planet.html" id="admin-add-link" style="display: none">Добавить планету</a></li>
            <li><a href="login.html" id="auth-link">Войти</a></li>
          </ul>
        </nav>
      </div>
    </header>

    <main>
      <div class="container">
        <h1>Каталог планет</h1>
        <div class="sorting">
          <div>
            <label for="sort">Сортировка:</label>
            <select id="sort">
              <option value="name-asc">По названию (А-Я)</option>
              <option value="name-desc">По названию (Я-А)</option>
              <option value="price-asc">По цене (возрастание)</option>
              <option value="price-desc">По цене (убывание)</option>
            </select>
          </div>
          <div class="search-box">
            <input
              type="text"
              id="search-input"
              placeholder="Поиск планеты..."
            />
            <button id="search-btn" class="btn">Найти</button>
          </div>
        </div>

        <div class="catalog-container">
          <aside class="filters">
            <h3>Фильтры</h3>

            <div class="filter-group">
              <h4>Тип планеты</h4>
              <div class="filter-option">
                <input type="checkbox" id="type-rocky" value="Каменистая" />
                <label for="type-rocky">Каменистые</label>
              </div>
              <div class="filter-option">
                <input type="checkbox" id="type-gas" value="Газовая" />
                <label for="type-gas">Газовые гиганты</label>
              </div>
              <div class="filter-option">
                <input type="checkbox" id="type-ice" value="Ледяной гигант" />
                <label for="type-ice">Ледяные гиганты</label>
              </div>
              <div class="filter-option">
                <input
                  type="checkbox"
                  id="type-dwarf"
                  value="Карликовая планета"
                />
                <label for="type-dwarf">Карликовые</label>
              </div>
            </div>

            <div class="filter-group">
              <h4>Цена</h4>
              <div class="filter-option">
                <input type="radio" name="price-range" value="all" checked />
                <label>Все</label>
              </div>
              <div class="filter-option">
                <input type="radio" name="price-range" value="0-2b" />
                <label>До 2 млрд ₽</label>
              </div>
              <div class="filter-option">
                <input type="radio" name="price-range" value="2b-5b" />
                <label>2-5 млрд ₽</label>
              </div>
              <div class="filter-option">
                <input type="radio" name="price-range" value="5b+" />
                <label>От 5 млрд ₽</label>
              </div>
            </div>

            <div class="filter-group">
              <h4>Наличие</h4>
              <div class="filter-option">
                <input type="checkbox" id="show-available" />
                <label for="show-available">Только в наличии</label>
              </div>
            </div>

            <button id="apply-filters" class="btn" style="width: 100%">
              Применить фильтры
            </button>
            <button
              id="reset-filters"
              class="btn"
              style="width: 100%; margin-top: 10px; background: #95a5a6"
            >
              Сбросить
            </button>
          </aside>

          <div class="catalog">
            <div id="planets-container" class="planets-grid">
              <div class="loading-spinner">Загрузка планет...</div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <footer>
      <div class="container">
        <div class="footer-links">
          <a href="index.html">О нас</a>
          <a href="#">Facebook</a>
          <a href="#">Twitter</a>
          <a href="#">Instagram</a>
        </div>
        <p>
          &copy; 2024 MWSW - The Man Who Sold The World. Все права защищены.
        </p>
      </div>
    </footer>

    <script>
      const API_BASE_URL = "https://backend-production-7272.up.railway.app";
      let currentUser = null;
      let allPlanets = [];
      let favorites = new Set();
      const ADMIN_EMAILS = new Set(["admin@example.com", "ivan@example.com"]);

      function checkAuth() {
        const user =
          localStorage.getItem("currentUser") ||
          sessionStorage.getItem("currentUser");
        if (user) {
          currentUser = JSON.parse(user);
          const displayName = currentUser.fullName || currentUser.FullName || "";
          document.getElementById("auth-link").textContent = displayName
            ? displayName.split(" ")[0]
            : "Profile";
          document.getElementById("auth-link").href = "profile.html";
          loadFavorites();
        } else {
          document.getElementById("auth-link").textContent = "Войти";
          document.getElementById("auth-link").href = "login.html";
        }
        toggleAdminLink();
      }

      function getCurrentUserId() {
        if (!currentUser) return null;
        return currentUser.id ?? currentUser.Id ?? null;
      }

      function getCurrentUserEmail() {
        if (!currentUser) return "";
        const email = currentUser.email ?? currentUser.Email ?? "";
        return typeof email === "string" ? email.trim() : "";
      }

      function isCurrentUserAdmin() {
        if (!currentUser) return false;

        if (currentUser.isAdmin === true || currentUser.IsAdmin === true) {
          return true;
        }

        const email = getCurrentUserEmail().toLowerCase();
        return email ? ADMIN_EMAILS.has(email) : false;
      }

      function toggleAdminLink() {
        const link = document.getElementById("admin-add-link");
        if (!link) return;
        link.style.display = isCurrentUserAdmin() ? "inline-block" : "none";
      }

      async function updateCartCounter() {
        const cartLink = document.getElementById("cart-link");
        if (!cartLink) return;

        const baseLabel =
          cartLink.dataset.baseLabel ||
          cartLink.textContent.replace(/\s*\(\d+\)\s*$/, "").trim() ||
          "Cart";
        cartLink.dataset.baseLabel = baseLabel;

        try {
          const userId = getCurrentUserId();
          let url = `${API_BASE_URL}/api/cart`;
          if (userId !== null && userId !== undefined) {
            url += `?userId=${encodeURIComponent(userId)}`;
          }

          const response = await fetch(url);
          if (!response.ok) throw new Error("Failed to load cart");

          const items = await response.json();
          const totalCount = Array.isArray(items)
            ? items.reduce((sum, item) => {
                const qty = Number(item?.Quantity ?? item?.quantity ?? 0);
                return sum + (Number.isFinite(qty) && qty > 0 ? qty : 0);
              }, 0)
            : 0;

          cartLink.textContent =
            totalCount > 0 ? `${baseLabel} (${totalCount})` : baseLabel;
        } catch (error) {
          console.error("Error loading cart counter:", error);
          cartLink.textContent = baseLabel;
        }
      }

      function escapeHtml(text) {
        if (!text) return "";
        const div = document.createElement("div");
        div.textContent = text;
        return div.innerHTML;
      }

      function formatPrice(price) {
        if (!price && price !== 0) return "0";
        return price.toString().replace(/\B(?=(\d{3})+(?!\d))/g, " ");
      }

      function getSafeImageUrl(rawUrl) {
        const fallback = "https://via.placeholder.com/300x200";
        const value = String(rawUrl ?? "").trim();
        if (!value) return fallback;

        try {
          const parsed = new URL(value);
          if (parsed.protocol === "http:" || parsed.protocol === "https:") {
            return parsed.href;
          }
        } catch {
          return fallback;
        }

        return fallback;
      }

      async function loadFavorites() {
        if (!currentUser) return;

        try {
          const response = await fetch(
            `${API_BASE_URL}/api/favorites/${currentUser.id}`,
          );
          if (response.ok) {
            const favoritesList = await response.json();
            favorites.clear();
            favoritesList.forEach((planet) => {
              const id = planet.Id || planet.id;
              favorites.add(id);
            });
            displayPlanets(allPlanets);
          }
        } catch (error) {
          console.error("Ошибка загрузки избранного:", error);
        }
      }

      async function toggleFavorite(planetId, buttonElement) {
        if (!currentUser) {
          showNotification("Пожалуйста, войдите в аккаунт", "error");
          setTimeout(() => {
            window.location.href = "login.html";
          }, 1500);
          return;
        }

        try {
          if (favorites.has(planetId)) {
            const response = await fetch(
              `${API_BASE_URL}/api/favorites/remove?userId=${currentUser.id}&planetId=${planetId}`,
              {
                method: "DELETE",
              },
            );
            if (response.ok) {
              favorites.delete(planetId);
              buttonElement.classList.remove("active");
              buttonElement.innerHTML = "♡";
              showNotification("Удалено из избранного", "success");
            }
          } else {
            const response = await fetch(`${API_BASE_URL}/api/favorites/add`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                userId: currentUser.id,
                planetId: planetId,
              }),
            });
            if (response.ok) {
              favorites.add(planetId);
              buttonElement.classList.add("active");
              buttonElement.innerHTML = "❤️";
              showNotification("Добавлено в избранное", "success");
            }
          }
        } catch (error) {
          console.error("Ошибка:", error);
          showNotification("Ошибка при выполнении операции", "error");
        }
      }

      function showNotification(message, type) {
        const notification = document.createElement("div");
        notification.className = "toast-notification";
        notification.style.background =
          type === "error" ? "#e74c3c" : "#27ae60";
        notification.textContent = message;
        document.body.appendChild(notification);
        setTimeout(() => notification.remove(), 3000);
      }

      async function loadPlanets() {
        try {
          const response = await fetch(`${API_BASE_URL}/api/planets`);
          if (!response.ok) throw new Error("Ошибка загрузки");
          allPlanets = await response.json();
          console.log("Загружены планеты:", allPlanets); // Для отладки
          displayPlanets(allPlanets);
        } catch (error) {
          console.error("Ошибка загрузки планет:", error);
          document.getElementById("planets-container").innerHTML =
            '<div class="no-results">Ошибка загрузки данных. Убедитесь, что сервер запущен.</div>';
        }
      }

      function displayPlanets(planets) {
        const container = document.getElementById("planets-container");

        if (!planets || planets.length === 0) {
          container.innerHTML =
            '<div class="no-results">Нет планет, соответствующих критериям</div>';
          return;
        }

        container.innerHTML = planets
          .map((planet) => {
            // Поля приходят с заглавной буквы!
            const id = planet.Id;
            const name = planet.Name || "Без названия";
            const imageUrl = getSafeImageUrl(planet.ImageUrl);
            const price = planet.Price || 0;
            const type = planet.Type || "Неизвестно";
            const mass = planet.Mass || "Н/Д";
            const diameter = planet.Diameter || "Н/Д";
            const moons = planet.Moons ?? 0;
            const shortDescription =
              planet.ShortDescription || "Описание отсутствует";
            const soldOut = planet.SoldOut === true;
            const isFavorite = favorites.has(id);

            return `
                    <div class="planet-card ${soldOut ? "sold-out" : ""}">
                        <div class="planet-media">
                        <a href="planet.html?id=${id}">
                            <img src="${imageUrl}" 
                                 alt="${escapeHtml(name)}" 
                                 class="planet-image"
                                 onerror="this.src='https://via.placeholder.com/300x200'">
                        </a>
                        <button class="favorite-btn ${isFavorite ? "active" : ""}" 
                                data-planet-id="${id}">
                            ${isFavorite ? "❤️" : "♡"}
                        </button>
                        </div>
                        <div class="planet-info">
                            <h3><a href="planet.html?id=${id}" style="text-decoration: none; color: inherit;">${escapeHtml(name)}</a></h3>
                            <p class="planet-description">${escapeHtml(shortDescription)}</p>
                            <div class="planet-price">${formatPrice(price)} ₽</div>
                            ${
                              !soldOut
                                ? `<button class="btn add-to-cart" data-planet-id="${id}" data-planet-name="${escapeHtml(name)}">В корзину</button>`
                                : '<button class="btn" disabled style="background: #95a5a6;">Распродано</button>'
                            }
                        </div>
                    </div>
                `;
          })
          .join("");

        document.querySelectorAll(".favorite-btn").forEach((btn) => {
          btn.addEventListener("click", (e) => {
            e.preventDefault();
            e.stopPropagation();
            const planetId = parseInt(btn.dataset.planetId);
            toggleFavorite(planetId, btn);
          });
        });

        document.querySelectorAll(".add-to-cart").forEach((btn) => {
          btn.addEventListener("click", (e) => {
            e.preventDefault();
            e.stopPropagation();
            const planetId = parseInt(btn.dataset.planetId);
            addToCart(planetId);
          });
        });
      }

      async function addToCart(planetId) {
        if (!currentUser) {
          showNotification("Пожалуйста, войдите в аккаунт", "error");
          setTimeout(() => {
            window.location.href = "login.html";
          }, 1500);
          return;
        }

        // Находим планету и проверяем наличие
        const planet = allPlanets.find((p) => p.Id === planetId);
        if (!planet) {
          showNotification("Планета не найдена", "error");
          return;
        }

        if (planet.SoldOut === true) {
          showNotification(
            "Эта планета распродана и не может быть добавлена в корзину",
            "error",
          );
          return;
        }

        try {
          const response = await fetch(`${API_BASE_URL}/api/cart/add`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              userId: currentUser.id,
              planetId: planetId,
              quantity: 1,
            }),
          });

          if (response.ok) {
            showNotification("Товар добавлен в корзину", "success");
            updateCartCounter();
          } else {
            const error = await response.json();
            showNotification(error.message || "Ошибка при добавлении", "error");
          }
        } catch (error) {
          console.error("Ошибка:", error);
          showNotification("Ошибка при добавлении", "error");
        }
      }

      function filterAndSort() {
        let filtered = [...allPlanets];

        const selectedTypes = [];
        if (document.getElementById("type-rocky").checked)
          selectedTypes.push("Каменистая");
        if (document.getElementById("type-gas").checked)
          selectedTypes.push("Газовая");
        if (document.getElementById("type-ice").checked)
          selectedTypes.push("Ледяной гигант");
        if (document.getElementById("type-dwarf").checked)
          selectedTypes.push("Карликовая планета");

        if (selectedTypes.length > 0) {
          filtered = filtered.filter((p) => selectedTypes.includes(p.Type));
        }

        const priceRange = document.querySelector(
          'input[name="price-range"]:checked',
        ).value;
        if (priceRange !== "all") {
          filtered = filtered.filter((p) => {
            const price = p.Price || 0;
            if (priceRange === "0-2b") return price < 2000000000;
            if (priceRange === "2b-5b")
              return price >= 2000000000 && price <= 5000000000;
            if (priceRange === "5b+") return price > 5000000000;
            return true;
          });
        }

        const showAvailable = document.getElementById("show-available").checked;
        if (showAvailable) {
          filtered = filtered.filter((p) => !p.SoldOut);
        }

        const searchTerm = document
          .getElementById("search-input")
          .value.toLowerCase();
        if (searchTerm) {
          filtered = filtered.filter(
            (p) =>
              (p.Name && p.Name.toLowerCase().includes(searchTerm)) ||
              (p.Type && p.Type.toLowerCase().includes(searchTerm)),
          );
        }

        const sortBy = document.getElementById("sort").value;
        switch (sortBy) {
          case "name-asc":
            filtered.sort((a, b) => (a.Name || "").localeCompare(b.Name || ""));
            break;
          case "name-desc":
            filtered.sort((a, b) => (b.Name || "").localeCompare(a.Name || ""));
            break;
          case "price-asc":
            filtered.sort((a, b) => (a.Price || 0) - (b.Price || 0));
            break;
          case "price-desc":
            filtered.sort((a, b) => (b.Price || 0) - (a.Price || 0));
            break;
        }

        displayPlanets(filtered);
      }

      function resetFilters() {
        document.getElementById("type-rocky").checked = false;
        document.getElementById("type-gas").checked = false;
        document.getElementById("type-ice").checked = false;
        document.getElementById("type-dwarf").checked = false;
        document.querySelector(
          'input[name="price-range"][value="all"]',
        ).checked = true;
        document.getElementById("show-available").checked = false;
        document.getElementById("search-input").value = "";
        document.getElementById("sort").value = "name-asc";
        filterAndSort();
      }

      document.addEventListener("DOMContentLoaded", () => {
        checkAuth();
        updateCartCounter();
        loadPlanets();

        document
          .getElementById("apply-filters")
          .addEventListener("click", filterAndSort);
        document
          .getElementById("reset-filters")
          .addEventListener("click", resetFilters);
        document
          .getElementById("search-btn")
          .addEventListener("click", filterAndSort);
        document
          .getElementById("search-input")
          .addEventListener("keypress", (e) => {
            if (e.key === "Enter") filterAndSort();
          });
        document
          .getElementById("sort")
          .addEventListener("change", filterAndSort);
      });
    </script>
  </body>
</html>
